<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tesla Taxi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>(function(){var tg=window.Telegram&&window.Telegram.WebApp;var q=new URLSearchParams(location.search).get("theme");var t=(q==="dark"||q==="light")?q:((tg&&tg.colorScheme)||"light");document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6; --card:#FFFFFF; --ink:#0E1116; --text:#0E1116; --muted:#667085; --line:#E3E5E9;
  --taxi:#FFD200; --ok:#17995B; --err:#C73A3A; --green:#0B7D3E;
  --pic:#F7F8F9; --nav:rgba(255,255,255,.96);
  --chip-on-bg:#0E1116; --chip-on-fg:#FFFFFF;
  --r-xl:26px; --r-lg:20px; --r-md:14px;
  color-scheme:light;
}
/* Темна тема (Telegram у темному режимі): окремі кольори, а не інверсія */
:root[data-theme="dark"]{
  --bg:#0F1216; --card:#181C22; --ink:#05070A; --text:#F2F4F7; --muted:#9AA3AF; --line:#2B313A;
  --ok:#1E9D63; --err:#FF7A7A; --green:#3DDC84;
  --nav:rgba(24,28,34,.96);
  --chip-on-bg:#FFD200; --chip-on-fg:#0E1116;
  color-scheme:dark;
}
:root[data-theme="dark"] .hero{border:1px solid var(--line)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px}
.ic.on{fill:var(--taxi)}
.btn .ic{width:18px;height:18px;margin-right:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--text);outline-offset:2px}

.checker{height:24px;background:repeating-conic-gradient(var(--ink) 0 25%, var(--taxi) 0 50%) 0 0/12px 12px}
header.top{background:var(--card);padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--taxi);display:grid;place-items:center;font-weight:800;font-size:18px}
header.top b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
header.top span{font-size:12.5px;color:var(--muted)}
.ticker{background:var(--card);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:9px 0}
.ticker .track{display:inline-flex;animation:run 28s linear infinite;will-change:transform}
.ticker .grp{display:inline-flex;flex:none}
.ticker .num{color:var(--text);font-weight:800;font-size:15px;letter-spacing:.01em;padding-right:56px}
.ticker .ph{color:var(--green)}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker{text-align:center}.ticker .track{animation:none;display:block}.ticker .grp+.grp{display:none}.ticker .num{padding:0}.ticker .grp .num:not(:first-child){display:none}}
.demo{background:var(--ink);color:#C9CDD3;font-size:12px;padding:7px 18px}
.demo b{color:var(--taxi)}

main{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.screen{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
h3{font-size:16px;font-weight:800;margin-bottom:8px}
.note{color:var(--muted);font-size:13px}

.hero{background:var(--ink);color:#fff;border-radius:var(--r-xl);padding:26px 22px 8px;position:relative;overflow:hidden;margin-bottom:16px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--taxi);opacity:.14}
.hero h1{font-size:33px;line-height:1.05;font-weight:800;letter-spacing:-.03em;position:relative}
.hero p{margin:12px 0 18px;color:#B6BCC6;max-width:30ch;position:relative}
.hero .row{display:flex;gap:10px;position:relative;margin-bottom:6px}
.hero .car-art{margin:10px -6px 0;position:relative}

.btn{display:block;width:100%;padding:16px;border-radius:var(--r-md);background:var(--taxi);color:var(--ink);font-weight:800;font-size:16px;text-align:center}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid #3A414C}
.btn.alt{background:var(--card);border:1px solid var(--line);color:var(--text)}
.btn:active{transform:scale(.99)}
.row .btn{flex:1;padding:14px 8px;font-size:15px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:12px}
.panel ul{list-style:none;display:grid;gap:12px}
.panel li{display:flex;gap:12px}
.panel li::before{content:"";flex:none;width:10px;height:10px;margin-top:6px;background:var(--taxi);border:2px solid var(--ink);border-radius:3px}
.panel li b{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.two .btn{padding:14px 8px;font-size:14.5px}

.tools{display:grid;grid-template-columns:1fr 128px;gap:8px;margin-bottom:10px}
input,select{width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:var(--r-md);font:inherit;background:var(--card);color:var(--text)}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--err)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:var(--chip-on-bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.car{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;position:relative}
.car .open{display:block;width:100%;text-align:left}
.pic{background:var(--pic);padding:18px 10px 6px}
.pic.photo{padding:0}
.pic img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.car .info{padding:10px 13px 14px}
.car .name{font-weight:800;font-size:16px}
.car .sub{color:var(--muted);font-size:12.5px}
.car .price{margin-top:8px;font-weight:800;font-size:16px}
.car .price small{font-weight:600;color:var(--muted);font-size:12px}
.photolabel{display:block;background:var(--ink);color:var(--taxi);font-weight:800;font-size:12px;letter-spacing:.02em;text-align:center;padding:7px 8px}
.car.ph .tag{top:40px}
.car.ph .fav{top:34px}
.fav{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.fav svg{width:20px;height:20px;fill:none;stroke:#0E1116;stroke-width:2;stroke-linecap:round}
.fav[aria-pressed="true"] svg{fill:var(--taxi);stroke:var(--ink)}
.tag{position:absolute;top:10px;left:10px;z-index:1;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:#fff;color:#0B7D3E;border:1.5px solid currentColor}
.tag.busy{color:#D62F2F}
svg.carsvg{width:100%;height:auto;display:block}

.card-detail{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;margin-bottom:12px}
.card-detail .pic{padding:30px 14px 12px;position:relative}
.card-detail .pic.photo{padding:0}
.card-detail .body{padding:18px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.spec{background:var(--bg);border-radius:var(--r-md);padding:11px 13px}
.spec span{display:block;color:var(--muted);font-size:12px}
.spec b{font-size:16px}
.back{display:inline-flex;gap:6px;font-weight:600;margin-bottom:12px;padding:6px 0}
.desc{margin:4px 0 12px;white-space:pre-line}

.calc{background:var(--bg);border:0;padding:16px;margin:0 0 14px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;margin:4px 0 12px}
.stepper button{height:52px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:800}
.stepper div{text-align:center;font-size:15px;color:var(--muted)}
.stepper b{font-size:28px;color:var(--text);letter-spacing:-.02em}
.calc .total{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px}
.calc .total small{font-size:13px;font-weight:600;color:var(--muted)}
.checkrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line)}
.checkrow:first-of-type{border-top:0}
.checkrow .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--text);display:grid;place-items:center;font-weight:800;font-size:15px;line-height:1}
.checkrow[aria-checked="true"] .box{background:var(--taxi);border-color:var(--taxi);color:#0E1116}
.checkrow[aria-checked="true"] .txt{color:var(--muted);text-decoration:line-through}
.progress{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:2px 0 8px}
.progress i{display:block;height:100%;background:var(--taxi);border-radius:99px;transition:width .2s}
label{display:block;font-weight:600;font-size:13.5px;margin:13px 0 5px}
.err{color:var(--err);font-size:12.5px;margin-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .chip{text-align:center;border-radius:var(--r-md)}
.done{text-align:center;padding:40px 12px}
.done .tick{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;font-size:40px;display:grid;place-items:center;margin:0 auto 18px}

details{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px}
summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:800;font-size:18px;line-height:1}
details[open] summary::after{content:"–"}
details p{padding:0 16px 15px;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;padding:11px 2px 9px;font-weight:600;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--text);font-weight:800;box-shadow:inset 0 3px 0 var(--taxi)}
nav.tabs svg{width:22px;height:22px}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="checker" aria-hidden="true"></div>
<header class="top">
  <div class="logo" aria-hidden="true">T</div>
  <div><b>Tesla Taxi Odessa</b><span>Оренда авто та робота водієм</span></div>
</header>
<div class="ticker" role="marquee" aria-label="Телефон для зв'язку"><div class="track" id="track" aria-hidden="true"></div></div>
<div class="demo" id="demoBar"><b>Демо-версія.</b> Авто, ціни та умови — тестові, не реальний автопарк.</div>

<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<nav class="tabs" aria-label="Розділи">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg>Головна</button>
  <button data-tab="cars"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l2-6h14l2 6v4H3z"/><circle cx="7.5" cy="16" r="1.2"/><circle cx="16.5" cy="16" r="1.2"/></svg>Авто</button>
  <button data-tab="work"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Робота</button>
  <button data-tab="apply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>Заявка</button>
</nav>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ----- Тема: темна, якщо Telegram у темному режимі (для перевірки: додайте ?theme=dark до адреси) ----- */
function applyTheme(){
  const q = new URLSearchParams(location.search).get("theme");
  const t = (q==="dark"||q==="light") ? q : ((tg && tg.colorScheme) || "light");
  document.documentElement.setAttribute("data-theme", t);
  if(tg){
    try{ tg.setHeaderColor(t==="dark" ? "#181C22" : "#FFFFFF"); }catch(e){}
    try{ tg.setBackgroundColor(t==="dark" ? "#0F1216" : "#F3F4F6"); }catch(e){}
  }
}
applyTheme();
if(tg) tg.onEvent("themeChanged", applyTheme);

/* ----- Іконка «серце» — той самий стиль, що й у нижньому меню ----- */
const HEART = '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>';
function heartIcon(on){ return `<svg class="ic${on?" on":""}" viewBox="0 0 24 24" aria-hidden="true">${HEART}</svg>`; }

/* =====================  НАЛАШТУВАННЯ  ===================== */
// Посилання на опубліковану Google-таблицю (формат CSV, аркуш "Cars").
// Поки порожньо — застосунок показує вбудовані ТЕСТОВІ авто.
const SHEET_CSV_URL = "";
// Папка з фото в репозиторії. У таблиці достатньо вказати назву файлу.
const PHOTOS_DIR = "photos/";
// true — показувати позначки «демо». Поставте false, коли підключите реальні дані.
const DEMO_MODE = true;
// Telegram-імʼя менеджера без @ (наприклад "my_manager"):
const MANAGER_USERNAME = "";
/* ========================================================== */

// Номер у бігучому рядку під шапкою:
const PHONE_DISPLAY = "+38(050)9998887";
(function(){
  const grp = '<span class="grp">' + Array(8).fill('<span class="num">Головний менеджер: <span class="ph">'+PHONE_DISPLAY+'</span></span>').join("") + '</span>';
  document.getElementById("track").innerHTML = grp + grp;
})();

const DEMO = DEMO_MODE ? " (демо)" : "";
if (!DEMO_MODE) document.getElementById("demoBar").style.display = "none";

/* ----- Вбудовані тестові дані (НЕ реальний автопарк) ----- */
const RAW = [
 ["Model 3","Standard Range",2021,"Білий","#F2F2F2",5,420,1100],
 ["Model 3","Long Range",2022,"Чорний","#1B1B1D",5,560,1300],
 ["Model 3","Performance",2021,"Червоний","#B3262E",5,510,1500],
 ["Model 3","Long Range",2023,"Сірий","#7C8087",5,570,1350],
 ["Model 3","Standard Range",2020,"Синій","#27498F",5,400,1000],
 ["Model 3","Long Range",2022,"Білий","#F2F2F2",5,560,1300],
 ["Model 3","Long Range",2021,"Сріблястий","#BFC3C9",5,540,1250],
 ["Model Y","Long Range",2022,"Білий","#F2F2F2",5,500,1500],
 ["Model Y","Long Range",2023,"Чорний","#1B1B1D",5,520,1600],
 ["Model Y","Performance",2022,"Сірий","#7C8087",5,480,1700],
 ["Model Y","Long Range",2021,"Синій","#27498F",5,490,1450],
 ["Model Y","Standard Range",2023,"Білий","#F2F2F2",5,430,1350],
 ["Model Y","Long Range",2022,"Червоний","#B3262E",5,500,1550],
 ["Model Y","Long Range",2023,"Сріблястий","#BFC3C9",7,500,1650],
 ["Model S","Long Range",2019,"Чорний","#1B1B1D",5,590,2000],
 ["Model S","Plaid",2022,"Білий","#F2F2F2",5,600,2600],
 ["Model S","Long Range",2020,"Сірий","#7C8087",5,610,2100],
 ["Model X","Long Range",2020,"Білий","#F2F2F2",6,540,2800],
 ["Model X","Plaid",2022,"Чорний","#1B1B1D",6,560,3300],
 ["Model X","Long Range",2021,"Синій","#27498F",7,550,2900],
];
const BUILTIN = RAW.map((r,i)=>({model:r[0],trim:r[1],year:r[2],color:r[3],hex:r[4],seats:r[5],range:r[6],price:r[7],desc:"",photo:"",busy:(i+1)%4===0}));

/* ----- Читання таблиці ----- */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  text = text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=ch;
    } else if(ch==='"') q=true;
    else if(ch===","){ row.push(cell); cell=""; }
    else if(ch==="\n"||ch==="\r"){
      if(ch==="\r"&&text[i+1]==="\n") i++;
      row.push(cell); cell=""; rows.push(row); row=[];
    } else cell+=ch;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function rowsToCars(rows){
  if(rows.length<2) return [];
  const head = rows[0].map(h=>h.trim().toLowerCase());
  const idx = n => head.indexOf(n);
  const get = (r,n)=>{ const i=idx(n); return i>=0 ? (r[i]||"").trim() : ""; };
  const cars=[];
  rows.slice(1).forEach(r=>{
    const status = get(r,"status").toLowerCase();
    if(status!=="вільне" && status!=="зайняте") return;   // ремонт, прихований, помилки — не показуємо
    const model = get(r,"model"); if(!model) return;
    let photo = get(r,"photo_url");
    if(photo && !/^https?:\/\//i.test(photo)) photo = PHOTOS_DIR + photo.replace(/^\/+/,"");
    cars.push({
      model, trim:get(r,"trim"), year:+get(r,"year")||0, color:get(r,"color"),
      hex:get(r,"color_hex")||"#9AA0A8", seats:+get(r,"seats")||0,
      range:+get(r,"range_km")||0, price:+(get(r,"price").replace(/\D/g,""))||0,
      desc:get(r,"description"), photo, busy:status==="зайняте"
    });
  });
  return cars;
}

/* ----- Стан ----- */
let CARS = [];            // з id
const state = { tab:"home", carId:null, days:7, check:{}, filter:"Усі", q:"", sort:"def", favs:new Set(),
  load: SHEET_CSV_URL ? "loading" : "ok", done:false, errors:{},
  form:{name:"",phone:"",age:"",exp:"",taxi:"Ні",city:"",schedule:"",carId:""} };
const $app = document.getElementById("app");
const uah = n => n.toLocaleString("uk-UA") + " ₴";

function setCars(list){ CARS = list.map((c,i)=>({...c,id:i+1})); }
async function loadCars(){
  if(!SHEET_CSV_URL){ setCars(BUILTIN); state.load="ok"; return; }
  state.load="loading"; if(state.tab==="cars") render();
  try{
    const res = await fetch(SHEET_CSV_URL);
    if(!res.ok) throw new Error("HTTP "+res.status);
    setCars(rowsToCars(parseCSV(await res.text())));
    state.load="ok";
  }catch(e){ console.error(e); state.load="error"; }
  render();
}

let toastTimer;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}
function contact(){
  if(MANAGER_USERNAME){ const u="https://t.me/"+MANAGER_USERNAME; return tg?tg.openTelegramLink(u):window.open(u,"_blank"); }
  toast("Тут буде чат із менеджером");
}

function carSvg(hex, glass){
  glass = glass || "#DDE6EE";
  return `<svg class="carsvg" viewBox="0 0 240 92" role="img" aria-label="Ілюстрація автомобіля">
    <ellipse cx="120" cy="82" rx="104" ry="5" fill="#000" opacity=".10"/>
    <path d="M8 64 Q10 50 40 46 L70 27 Q80 22 98 22 L148 22 Q168 25 182 41 L214 47 Q234 51 234 64 L234 70 H8Z" fill="${hex}" stroke="#15181E" stroke-opacity=".25" stroke-width="1.5"/>
    <path d="M78 31 Q84 27 98 27 L120 27 L120 44 L62 44Z" fill="${glass}" opacity=".9"/>
    <path d="M126 27 L148 27 Q162 29 172 42 L126 44Z" fill="${glass}" opacity=".9"/>
    <circle cx="62" cy="70" r="15" fill="#15181E"/><circle cx="62" cy="70" r="7" fill="#9AA0A8"/>
    <circle cx="184" cy="70" r="15" fill="#15181E"/><circle cx="184" cy="70" r="7" fill="#9AA0A8"/>
  </svg>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function pic(c){
  return c.photo
    ? `<div class="pic photo"><img src="${esc(c.photo)}" alt="${esc(c.model+" "+c.color)}" loading="lazy" data-hex="${esc(c.hex)}"></div>`
    : `<div class="pic">${carSvg(c.hex)}</div>`;
}
// Якщо фото не завантажилось — показуємо ілюстрацію
document.addEventListener("error",ev=>{
  const img=ev.target;
  if(img && img.tagName==="IMG" && img.dataset.hex){
    const box=img.parentElement; box.classList.remove("photo"); box.innerHTML=carSvg(img.dataset.hex);
  }
},true);

function filters(){ return ["Усі","Вільні", ...Array.from(new Set(CARS.map(c=>c.model))), "Обране"]; }

/* ----- Екрани ----- */
function viewHome(){
  return `<div class="screen">
    <section class="hero">
      <h1>Tesla для роботи в таксі</h1>
      <p>Оберіть авто, залиште заявку — менеджер зв'яжеться з вами.</p>
      <div class="row">
        <button class="btn" data-tab="cars">Дивитись авто</button>
        <button class="btn ghost" data-tab="apply">Стати водієм</button>
      </div>
      <div class="car-art">${carSvg("#F2F2F2","#9FB3C8")}</div>
    </section>
    <div class="panel">
      <h3>Чому це зручно</h3>
      <ul>
        <li><div><b>Усі авто в одному каталозі</b><span class="note">Фото, характеристики та умови поруч.</span></div></li>
        <li><div><b>Заявка за хвилину</b><span class="note">Коротка анкета прямо в Telegram.</span></div></li>
        <li><div><b>Живий менеджер</b><span class="note">Відповість на питання й узгодить деталі.</span></div></li>
      </ul>
    </div>
    <div class="two">
      <button class="btn alt" data-contact="chat">Написати менеджеру</button>
      <button class="btn alt" data-free>Вільні авто зараз</button>
    </div>
  </div>`;
}

function viewCars(){
  if(state.load==="loading") return `<div class="screen"><h2>Каталог авто</h2><p class="note">Завантажуємо каталог…</p></div>`;
  if(state.load==="error") return `<div class="screen"><h2>Каталог авто</h2>
    <div class="panel" style="text-align:center"><h3>Не вдалося завантажити каталог</h3>
    <p class="note" style="margin-bottom:12px">Перевірте інтернет і спробуйте ще раз.</p>
    <button class="btn" data-retry>Спробувати ще раз</button></div></div>`;
  return `<div class="screen">
    <h2>Каталог авто</h2>
    <div class="tools">
      <input id="q" type="search" placeholder="Пошук: модель, колір, рік" value="${esc(state.q)}" aria-label="Пошук">
      <select id="sort" aria-label="Сортування">
        <option value="def" ${state.sort==="def"?"selected":""}>Сортувати</option>
        <option value="asc" ${state.sort==="asc"?"selected":""}>Дешевші</option>
        <option value="desc" ${state.sort==="desc"?"selected":""}>Дорожчі</option>
        <option value="year" ${state.sort==="year"?"selected":""}>Новіші</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Фільтр"></div>
    <div id="list"></div>
  </div>`;
}
function renderChips(){
  document.getElementById("chips").innerHTML = filters().map(m=>
    `<button class="chip" data-filter="${esc(m)}" aria-pressed="${state.filter===m}">${m==="Обране"?heartIcon(false)+"Обране":esc(m)}</button>`).join("");
}
function renderList(){
  let list = CARS.filter(c=> state.filter==="Обране" ? state.favs.has(c.id) : (state.filter==="Усі"||(state.filter==="Вільні"?!c.busy:c.model===state.filter)));
  const q = state.q.trim().toLowerCase();
  if(q) list = list.filter(c=>(c.model+" "+c.trim+" "+c.color+" "+c.year).toLowerCase().includes(q));
  if(state.sort==="asc") list.sort((a,b)=>a.price-b.price);
  if(state.sort==="desc") list.sort((a,b)=>b.price-a.price);
  if(state.sort==="year") list.sort((a,b)=>b.year-a.year);
  const el = document.getElementById("list");
  if(!CARS.length){ el.innerHTML=`<div class="panel" style="text-align:center"><h3>Зараз немає доступних авто</h3><p class="note">Зазирніть пізніше або залиште заявку — менеджер підбере варіант.</p></div>`; return; }
  if(!list.length){
    el.innerHTML = `<div class="panel" style="text-align:center"><h3>Нічого не знайдено</h3><p class="note" style="margin-bottom:12px">${state.filter==="Обране"?"Натисніть на сердечко на картці авто, щоб додати його в обране.":"Змініть пошук або фільтр."}</p><button class="btn alt" data-clear>Скинути фільтри</button></div>`;
    return;
  }
  el.innerHTML = `<div class="grid">${list.map(c=>`
    <article class="car${c.photo?"":" ph"}">
      <button class="open" data-car="${c.id}">
        ${c.photo?"":'<span class="photolabel">Ваше фото авто</span>'}
        ${pic(c)}
        <div class="info">
          <div class="name">${esc(c.model)}</div>
          <div class="sub">${esc([c.trim,c.year||"",c.color].filter(Boolean).join(" · "))}</div>
          <div class="price">${c.price?uah(c.price):"Ціна за запитом"} ${c.price?`<small>/ добу${DEMO}</small>`:""}</div>
        </div>
      </button>
      <span class="tag ${c.busy?"busy":""}">${c.busy?"Зайняте":"Вільне"}</span>
      <button class="fav" data-fav="${c.id}" aria-pressed="${state.favs.has(c.id)}" aria-label="Додати в обране">
        <svg viewBox="0 0 24 24" stroke-linejoin="round" aria-hidden="true">${HEART}</svg>
      </button>
    </article>`).join("")}</div>`;
}

function viewCar(){
  const c = CARS.find(x=>x.id===state.carId);
  if(!c){ state.carId=null; return viewCars(); }
  return `<div class="screen">
    <button class="back" data-back>‹ До каталогу</button>
    <div class="card-detail">
      <div style="position:relative"><span class="tag ${c.busy?"busy":""}">${c.busy?"Зайняте":"Вільне"}</span>${pic(c).replace('class="pic','class="pic detailpic')}</div>
      <div class="body">
        <h2 style="margin-bottom:2px">Tesla ${esc(c.model)}</h2>
        <p class="note">${esc([c.trim,c.year||""].filter(Boolean).join(" · "))}</p>
        <div class="specs">
          <div class="spec"><span>Колір</span><b>${esc(c.color||"—")}</b></div>
          <div class="spec"><span>Місць</span><b>${c.seats||"—"}</b></div>
          <div class="spec"><span>Запас ходу${DEMO}</span><b>${c.range?"~"+c.range+" км":"—"}</b></div>
          <div class="spec"><span>Оренда${DEMO}</span><b>${c.price?uah(c.price)+"/добу":"за запитом"}</b></div>
        </div>
        <div class="panel calc" id="calc"></div>
        ${c.desc?`<p class="desc">${esc(c.desc)}</p>`:""}
        ${DEMO_MODE?`<p class="note" style="margin-bottom:14px">Тестові дані для демонстрації. Реальні авто, ціни та умови узгоджуються з власником.</p>`:""}
        <button class="btn" data-apply-car="${c.id}">${c.busy?"Записатись у чергу":"Залишити заявку на це авто"}</button>
      </div>
    </div>
    <div class="two">
      <button class="btn alt" data-contact="chat">Написати менеджеру</button>
      <button class="btn alt" data-fav="${c.id}">${heartIcon(state.favs.has(c.id))}${state.favs.has(c.id)?"В обраному":"В обране"}</button>
    </div>
  </div>`;
}

function viewWork(){
  return `<div class="screen">
    <h2>Робота водієм</h2>
    <div class="panel"><h3>Як це працює</h3><ul>
      <li>Обираєте авто з каталогу</li>
      <li>Залишаєте коротку анкету</li>
      <li>Менеджер зв'язується й уточнює деталі</li>
      <li>Домовляєтесь про умови та початок роботи</li>
    </ul></div>
    <div class="panel" id="check"></div>
    <div class="panel"><h3>Умови співпраці</h3>
      <p class="note">Тут будуть реальні умови: графік, орендна плата, застава, комісії та правила. Їх надасть власник бізнесу.</p></div>
    <h3 style="margin:18px 0 10px">Часті питання</h3>
    <details><summary>Скільки коштує оренда?</summary><p>Ціни вказані в картці авто. Остаточні умови узгоджуються з менеджером.</p></details>
    <details><summary>Які потрібні документи?</summary><p>Перелік документів надасть менеджер після отримання заявки.</p></details>
    <details><summary>Чи потрібен досвід у таксі?</summary><p>Досвід бажаний, але не обов'язковий — це визначає власник.</p></details>
    <details><summary>Що буде після заявки?</summary><p>Менеджер розгляне анкету й зв'яжеться з вами.</p></details>
    <div style="height:10px"></div>
    <button class="btn" data-tab="apply">Заповнити анкету</button>
  </div>`;
}

function field(id,label,type,ph){
  const bad = state.errors[id];
  return `<label for="${id}">${label}</label>
    <input id="${id}" data-f="${id}" type="${type}" placeholder="${ph||""}" value="${esc(state.form[id])}" ${bad?'aria-invalid="true"':''} ${type==="tel"?'inputmode="tel" autocomplete="tel"':''} ${type==="number"?'inputmode="numeric"':''}>
    ${bad?`<div class="err">${bad}</div>`:""}`;
}
function viewApply(){
  if(state.done){
    return `<div class="screen done"><div class="tick" aria-hidden="true">✓</div>
      <h2>Заявку прийнято${DEMO_MODE?" (демо)":""}</h2>
      <p class="note" style="margin-bottom:22px">${DEMO_MODE?"У демо-версії заявка нікуди не надсилається й не зберігається. У робочій версії вона надійде власнику автоматично.":"Менеджер зв'яжеться з вами."}</p>
      <button class="btn alt" data-reset>Заповнити ще раз</button></div>`;
  }
  const f = state.form;
  return `<div class="screen">
    <h2>Анкета водія</h2>
    <p class="note">Заповніть кілька полів — це займе хвилину.</p>
    ${field("name","Ім'я","text","Ваше ім'я")}
    ${field("phone","Телефон","tel","+380...")}
    ${field("age","Вік","number","Наприклад, 30")}
    ${field("exp","Водійський стаж, років","number","Наприклад, 5")}
    <label>Чи працювали в таксі?</label>
    <div class="seg">${["Так","Ні"].map(v=>`<button type="button" class="chip" data-taxi="${v}" aria-pressed="${f.taxi===v}">${v}</button>`).join("")}</div>
    ${field("city","Місто","text","Ваше місто")}
    <label for="schedule">Графік роботи</label>
    <select id="schedule" data-f="schedule" ${state.errors.schedule?'aria-invalid="true"':''}>
      <option value="">Оберіть…</option>
      ${["Повний день","Денні зміни","Нічні зміни","Вихідні"].map(v=>`<option ${f.schedule===v?"selected":""}>${v}</option>`).join("")}
    </select>
    ${state.errors.schedule?`<div class="err">${state.errors.schedule}</div>`:""}
    <label for="carId">Цікавить авто</label>
    <select id="carId" data-f="carId">
      <option value="">Ще не вирішив(ла)</option>
      ${CARS.map(c=>`<option value="${c.id}" ${String(f.carId)===String(c.id)?"selected":""}>${esc([c.model,c.trim,c.year||"",c.color].filter(Boolean).join(" "))}</option>`).join("")}
    </select>
    <div style="height:18px"></div>
    <button class="btn" data-submit>Надіслати заявку</button>
  </div>`;
}

/* ----- Калькулятор оренди ----- */
function dayWord(n){
  const m10=n%10, m100=n%100;
  if(m10===1&&m100!==11) return "день";
  if(m10>=2&&m10<=4&&(m100<12||m100>14)) return "дні";
  return "днів";
}
function renderCalc(){
  const el=document.getElementById("calc"); if(!el) return;
  const c=CARS.find(x=>x.id===state.carId);
  if(!c||!c.price){ el.style.display="none"; return; }
  const n=state.days;
  el.innerHTML=`<h3>Калькулятор оренди</h3>
    <div class="stepper">
      <button data-days="-1" aria-label="Менше днів">−</button>
      <div><b>${n}</b> ${dayWord(n)}</div>
      <button data-days="1" aria-label="Більше днів">+</button>
    </div>
    <div class="chips" role="group" aria-label="Швидкий вибір">
      ${[1,3,7,14,30].map(v=>`<button class="chip" data-setdays="${v}" aria-pressed="${n===v}">${v}</button>`).join("")}
    </div>
    <div class="total">${uah(c.price*n)} <small>${DEMO}</small></div>
    <p class="note">Орієнтовна сума за ${n} ${dayWord(n)}. Без застави та додаткових платежів. Остаточні умови — з менеджером.</p>`;
}

/* ----- Чекліст водія ----- */
const CHECKLIST = [
  "Водійське посвідчення",
  "Документ, що посвідчує особу",
  "Telegram і робочий номер телефону",
  "Заповнена анкета в застосунку",
  "Розмова з менеджером"
];
function renderCheck(){
  const el=document.getElementById("check"); if(!el) return;
  const done=CHECKLIST.filter((_,i)=>state.check[i]).length;
  el.innerHTML=`<h3>Що підготувати для старту</h3>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${CHECKLIST.length}" aria-valuenow="${done}"><i style="width:${done/CHECKLIST.length*100}%"></i></div>
    <p class="note" style="margin-bottom:6px">Готово ${done} з ${CHECKLIST.length}</p>
    ${CHECKLIST.map((t,i)=>`<button class="checkrow" role="checkbox" aria-checked="${!!state.check[i]}" data-check="${i}"><span class="box" aria-hidden="true">${state.check[i]?"✓":""}</span><span class="txt">${t}</span></button>`).join("")}
    <p class="note" style="margin-top:10px">Приклад. Точний перелік надасть власник.</p>`;
}

/* ----- Рендер ----- */
function render(){
  let html;
  if(state.tab==="home") html = viewHome();
  else if(state.tab==="cars") html = state.carId ? viewCar() : viewCars();
  else if(state.tab==="work") html = viewWork();
  else html = viewApply();
  $app.innerHTML = html;
  if(state.tab==="cars" && !state.carId && state.load==="ok"){ renderChips(); renderList(); }
  if(state.tab==="cars" && state.carId) renderCalc();
  if(state.tab==="work") renderCheck();
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.dataset.tab===state.tab ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current");
  });
  if(tg){ (state.tab==="cars" && state.carId) ? tg.BackButton.show() : tg.BackButton.hide(); }
}
function go(tab){ state.tab=tab; if(tab!=="cars") state.carId=null; window.scrollTo(0,0); render(); }

function validate(){
  const f=state.form, e={};
  if(f.name.trim().length<2) e.name="Вкажіть ім'я";
  if(f.phone.replace(/\D/g,"").length<10) e.phone="Вкажіть номер телефону повністю";
  const age=+f.age; if(!age||age<18||age>75) e.age="Вік від 18 до 75";
  if(f.exp===""||+f.exp<0) e.exp="Вкажіть стаж (0, якщо немає)";
  if(f.city.trim().length<2) e.city="Вкажіть місто";
  if(!f.schedule) e.schedule="Оберіть графік";
  state.errors=e; return Object.keys(e).length===0;
}

/* ----- Події ----- */
document.addEventListener("click",ev=>{
  const t = ev.target.closest("[data-tab],[data-filter],[data-car],[data-back],[data-apply-car],[data-taxi],[data-submit],[data-reset],[data-fav],[data-contact],[data-clear],[data-retry],[data-free],[data-days],[data-setdays],[data-check]");
  if(!t) return;
  const d = t.dataset;
  if(d.tab) return go(d.tab);
  if(d.contact) return contact();
  if(d.days!==undefined){ state.days=Math.min(90,Math.max(1,state.days+(+d.days))); return renderCalc(); }
  if(d.setdays){ state.days=+d.setdays; return renderCalc(); }
  if(d.check!==undefined){ state.check[+d.check]=!state.check[+d.check]; return renderCheck(); }
  if(d.free!==undefined){ state.filter="Вільні"; state.q=""; state.carId=null; return go("cars"); }
  if(d.retry!==undefined) return loadCars();
  if(d.filter!==undefined){ state.filter=d.filter; renderChips(); return renderList(); }
  if(d.clear!==undefined){ state.filter="Усі"; state.q=""; state.sort="def"; return render(); }
  if(d.fav){
    const id=+d.fav; state.favs.has(id)?state.favs.delete(id):state.favs.add(id);
    if(tg&&tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    return state.carId ? render() : renderList();
  }
  if(d.car){ state.carId=+d.car; state.days=7; window.scrollTo(0,0); return render(); }
  if(d.back!==undefined){ state.carId=null; return render(); }
  if(d.applyCar){ state.form.carId=d.applyCar; state.done=false; return go("apply"); }
  if(d.taxi){ state.form.taxi=d.taxi; return render(); }
  if(d.submit!==undefined){
    if(validate()){ state.done=true; window.scrollTo(0,0); if(tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); }
    return render();
  }
  if(d.reset!==undefined){ state.done=false; state.errors={}; state.form={name:"",phone:"",age:"",exp:"",taxi:"Ні",city:"",schedule:"",carId:""}; return render(); }
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="q"){ state.q=el.value; return renderList(); }
  if(el.dataset&&el.dataset.f) state.form[el.dataset.f]=el.value;
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="sort"){ state.sort=el.value; return renderList(); }
  if(el.dataset&&el.dataset.f) state.form[el.dataset.f]=el.value;
});
if(tg) tg.BackButton.onClick(()=>{ state.carId=null; render(); });

render();
loadCars();
</script>
</body>
</html>
